services:
  # ─────────────────────────────────────────────────────────────
  # Backend: Fastify API (Node.js + Prisma + SQLite)
  # Free tier: SQLite stored in /tmp (ephemeral, resets on restart)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: razorpay-nexus-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        value: file:/tmp/dev.db
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

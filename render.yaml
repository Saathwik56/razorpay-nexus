services:
  # ─────────────────────────────────────────────────────────────
  # Backend: Fastify API (Node.js + Prisma + SQLite)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: razorpay-nexus-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        value: file:/data/dev.db
      - key: RAZORPAY_KEY_ID
        sync: false          # Set manually in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false          # Set manually in Render dashboard
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false          # Set manually in Render dashboard
    disk:
      name: razorpay-nexus-db
      mountPath: /data
      sizeGB: 1

  # ─────────────────────────────────────────────────────────────
  # Frontend: Vite React Static Site
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: razorpay-nexus-ui
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend URL e.g. https://razorpay-nexus-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://razorpay-nexus-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
